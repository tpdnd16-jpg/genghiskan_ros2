# PRD 7.7 기본값 (협동 로봇 픽앤플레이스 속도 가정). 단위: 초.
# 실제 로봇 측정값이 나오면(다음 단계) 이 값만 바꾸면 된다.
load:
  MOVE_TO_STOCK: 3
  PICK_BOARD: 2
  CHECK_GRIP: 1
  MOVE_TO_PRINTER: 3
  PLACE_IN_PRINTER: 2
  RETURN_HOME: 3

unload:
  MOVE_TO_PRINTER: 3
  PICK_FROM_PRINTER: 2
  CHECK_GRIP: 1
  MOVE_TO_PICKUP: 4
  PLACE_AT_PICKUP: 2
  RETURN_HOME: 3

# 층 보정: 1층 0초, 2층 +1초, 3층 +2초. MOVE_TO_PRINTER에 더한다.
floor_offset_sec:
  1: 0
  2: 1
  3: 2
